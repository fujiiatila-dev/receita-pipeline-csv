version: '3.8'

x-airflow-common: &airflow-common
  build: .
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

    # --- CREDENCIAIS E CONFIGS ---
    # Banco DW (Postgres Local)
    PG_HOST: postgres
    PG_USER: airflow
    PG_PASS: airflow

    # MinIO (Lakehouse S3)
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: minioadmin
    MINIO_SECRET_KEY: minioadmin

    # ClickHouse (opcional)
    CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-177.67.54.126}
    CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-8123}
    CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-empresas_ativas_do_brasil}
    CLICKHOUSE_SECURE: ${CLICKHOUSE_SECURE:-false}

    # Geocoding (incremental, mes a mes)
    GEOCODING_PROVIDER: ${GEOCODING_PROVIDER:-off}
    GEOCODING_BATCH_LIMIT: ${GEOCODING_BATCH_LIMIT:-1000}
    GEOCODING_NOMINATIM_URL: ${GEOCODING_NOMINATIM_URL:-https://nominatim.openstreetmap.org}
    GEOCODING_USER_AGENT: ${GEOCODING_USER_AGENT:-receita-pipeline-csv/1.0}
    GEOCODING_RATE_LIMIT: ${GEOCODING_RATE_LIMIT:-1.1}
    GEOCODING_DESC_CNAE_LIKE: ${GEOCODING_DESC_CNAE_LIKE:-}
    GEOCODING_PRIORITY_TABLE: ${GEOCODING_PRIORITY_TABLE:-}
    GEOCODING_FLUSH_EVERY: ${GEOCODING_FLUSH_EVERY:-500}
    CLEANUP_GEO_MIN_THRESHOLD: ${CLEANUP_GEO_MIN_THRESHOLD:-10000000}

    # Spark
    JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    SPARK_HOME: /opt/airflow/spark
  volumes:
    - ./dags:/opt/airflow/dags
    - ./scripts:/opt/airflow/scripts
    # Mantemos o volume data mapeado caso queira debug local, 
    # mas o foco agora será o MinIO
    - ./data:/opt/airflow/data
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_healthy

services:
  # --- O DATA LAKE (MinIO) ---
  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000" # API S3
      - "9010:9001" # Console Visual (Acesse aqui)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    volumes:
      - minio_storage:/data # Persistência do Lake
    networks:
      - data-network

  # --- O DATA WAREHOUSE (Postgres) ---
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "airflow" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data-network

  # --- O ORQUESTRADOR (Airflow) ---
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password admin
    networks:
      - data-network

  airflow-webserver:
    <<: *airflow-common
    command: airflow webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 30s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    networks:
      - data-network

  airflow-scheduler:
    <<: *airflow-common
    command: airflow scheduler
    shm_size: '4gb'
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    networks:
      - data-network

volumes:
  minio_storage:
  postgres_data:


networks:
  data-network:
    external: true
